[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulmoscan"
version = "0.1.0"
description = "PulmoScan AI — hybrid 3D CNN + Swin Transformer for lung nodule malignancy risk"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PulmoScan AI" }]
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "nibabel>=5.1",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "einops>=0.7",
  "gradio>=4.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
pulmoscan-train = "pulmoscan.classification.train:main"
pulmoscan-eval = "pulmoscan.evaluation.evaluate:main"
pulmoscan-demo = "pulmoscan.inference.demo_app:main"
pulmoscan-synth = "pulmoscan.data.synthetic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
