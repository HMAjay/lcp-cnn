# Expects preprocessing layout from PREPROCESSING_README.md
data_root: ${oc.env:PULMOSCAN_DATA_ROOT,./data/processed}
manifest: manifests/dataset_manifest.json
splits: manifests/patient_splits.json

voi_size: [48, 48, 48]
hu_window: [-1000, 400]
normalize: true  # map windowed HU to [0, 1]

# Malignancy label rule (LIDC characteristic 1–5)
# malignant: mean >= malignant_min
# benign: mean <= benign_max
# otherwise: excluded (uncertain)
labeling:
  malignant_min: 4.0
  benign_max: 2.0
  use_physical_nodules: true
  min_confidence: low  # high | medium | low (include this level and higher)
  require_centroid: true
  include_uncertain: true  # keep LIDC score-3 for TG-Hybrid abstain head
  subsolid_texture_max: 3.0
  soft_malignancy: true  # train on (LIDC 1–5)/scaled target, not only hard 0/1

augmentation:
  train:
    flip_prob: 0.5
    rotate90_prob: 0.5
    gaussian_noise_std: 0.02
    intensity_scale: [0.9, 1.1]
    intensity_shift: [-0.05, 0.05]
    centroid_jitter_mm: 3.0  # random crop offset; 1 mm voxels
  val: {}

# 0 is safest on Colab (avoids worker RAM kills when caching 3D volumes)
num_workers: 0
pin_memory: true
