seed: 42
epochs: 50
batch_size: 4
lr: 1.0e-4
weight_decay: 1.0e-4
warmup_epochs: 2
grad_accum_steps: 2
max_grad_norm: 1.0
amp: true
early_stopping_patience: 15
balanced_sampler: true
uncertain_sample_weight: 0.25  # keep score-3 in the mix, but don't dominate batches
mixup_alpha: 0.15
ema: true
ema_decay: 0.998
tta: true

loss:
  name: tg_hybrid  # tg_hybrid | weighted_bce | focal
  focal_gamma: 2.0
  pos_weight: null  # auto from train set if null
  lambda_mal: 1.0
  lambda_concept: 0.35
  lambda_gate: 0.25
  lambda_expert: 0.35
  lambda_abstain: 0.1

checkpoint_dir: ./artifacts/checkpoints
log_dir: ./artifacts/logs
save_every: 5

# Smoke / CI overrides via CLI: --epochs 1 --batch-size 2
